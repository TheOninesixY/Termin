name: Build and Release Flatpak

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-flatpak:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged

    steps:
      - name: Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "[INFO] Importing GPG private key..."
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Setup Flathub Repository
        run: |
          echo "[INFO] Adding Flathub remote repository..."
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Fetch Remote Manifest and Execute Build
        run: |
          set -euo pipefail

          # Configuration
          APP_ID="io.github.theoninesixy.Termin"
          MANIFEST_URL="https://raw.githubusercontent.com/TheOninesixY/flathub/refs/heads/io.github.theoninesixy.Termin/io.github.theoninesixy.Termin.yml"
          MANIFEST="${APP_ID}.yml"
          REPO_DIR="."
          BUNDLE_NAME="Termin.flatpak"
          GPG_KEY="C40563883002D85414F6517269B202E6183A72A2"
          BUILD_DIR="build-dir"

          echo "[INFO] Downloading remote manifest from ${MANIFEST_URL}..."
          curl -fsSL "${MANIFEST_URL}" -o "${MANIFEST}"

          echo "[INFO] Starting flatpak-builder export to OSTree repository..."
          flatpak-builder \
            --user \
            --install-deps-from=flathub \
            --gpg-sign="${GPG_KEY}" \
            --repo="${REPO_DIR}" \
            --force-clean \
            "${BUILD_DIR}" \
            "${MANIFEST}"

          echo "[INFO] Updating repository summary and generating static deltas..."
          flatpak build-update-repo \
            --gpg-sign="${GPG_KEY}" \
            --generate-static-deltas \
            "${REPO_DIR}"

          echo "[INFO] Building flatpak bundle without external runtime repo..."
          flatpak build-bundle \
            --gpg-sign="${GPG_KEY}" \
            "${REPO_DIR}" \
            "${BUNDLE_NAME}" \
            "${APP_ID}"

          echo "[INFO] Build process completed successfully."

      - name: Upload Flatpak Bundle to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: Termin.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}