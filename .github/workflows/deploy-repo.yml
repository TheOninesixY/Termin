name: Build Flatpak Repo and Deploy Pages

on:
  push:
    branches:
      - page
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged

    steps:
      - name: Checkout Documentation (page branch)
        uses: actions/checkout@v4
        with:
          ref: page

      - name: Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "[INFO] Importing GPG private key..."
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Setup Flathub Repository
        run: |
          echo "[INFO] Adding Flathub remote repository..."
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build OSTree Flatpak Repository
        run: |
          set -euo pipefail

          # Configuration
          APP_ID="io.github.theoninesixy.Termin"
          MANIFEST_URL="https://raw.githubusercontent.com/TheOninesixY/flathub/refs/heads/io.github.theoninesixy.Termin/io.github.theoninesixy.Termin.yml"
          MANIFEST="${APP_ID}.yml"
          REPO_DIR="."
          BUILD_DIR="build-dir"

          echo "[INFO] Downloading remote manifest..."
          curl -fsSL "${MANIFEST_URL}" -o "${MANIFEST}"

          if [ ! -d "${REPO_DIR}/objects" ]; then
            echo "[INFO] Initializing OSTree repository..."
            ostree init --mode=archive-z2 --repo="${REPO_DIR}"
          fi

          echo "[INFO] Exporting to OSTree repository..."
          flatpak-builder \
            --user \
            --install-deps-from=flathub \
            --gpg-sign="C40563883002D85414F6517269B202E6183A72A2" \
            --repo="${REPO_DIR}" \
            --force-clean \
            "${BUILD_DIR}" \
            "${MANIFEST}"

          echo "[INFO] Updating repository summary and static deltas..."
          flatpak build-update-repo \
            --gpg-sign="C40563883002D85414F6517269B202E6183A72A2" \
            --generate-static-deltas \
            "${REPO_DIR}"

          # Clean temporary files
          rm -rf "${MANIFEST}" "${BUILD_DIR}" .flatpak-builder
          echo "[INFO] OSTree repository built successfully."

      - name: Build Jekyll Site and Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4